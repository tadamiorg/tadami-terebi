[versions]
agp = "9.2.1"
kotlin = "2.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
composeBom = "2026.06.00"
media3 = "1.10.1"
tvMaterial = "1.1.0"
castTv = "21.1.1"
castCore = "22.3.1"
coil = "2.7.0"
okhttp = "5.4.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
profileinstaller = "1.4.1"
dotenv_version = "4.0.0"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-material3 = { module = "androidx.compose.material3:material3" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }

# Exoplayer
media3-exoplayer = {group = "androidx.media3", name="media3-exoplayer", version.ref="media3"}
media3-ui = {group = "androidx.media3", name="media3-ui", version.ref="media3"}
media3-exoplayer-dash = {group = "androidx.media3", name="media3-exoplayer-dash", version.ref="media3"}
media3-exoplayer-hls = {group = "androidx.media3", name="media3-exoplayer-hls", version.ref="media3"}
media3-exoplayer-rtsp = {group = "androidx.media3", name="media3-exoplayer-rtsp", version.ref="media3"}
media3-exoplayer-smoothstreaming = {group = "androidx.media3", name="media3-exoplayer-smoothstreaming", version.ref="media3"}
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }


cast-tv = { module = "com.google.android.gms:play-services-cast-tv", version.ref = "castTv" }
cast-core = { module = "com.google.android.gms:play-services-cast", version.ref = "castCore" }
play-services-basement = "com.google.android.gms:play-services-basement:18.5.0"

androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dotenv = { id = "co.uzzu.dotenv.gradle", version.ref = "dotenv_version" }

[bundles]
exoplayer = ["media3-exoplayer","media3-ui","media3-exoplayer-dash","media3-exoplayer-hls","media3-exoplayer-rtsp","media3-exoplayer-smoothstreaming"]
